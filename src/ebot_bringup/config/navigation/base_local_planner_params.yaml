TrajectoryPlannerROS:
  max_vel_x: 0.5
  min_vel_x: 0.1
  max_vel_theta: 1.0
  min_in_place_vel_theta: 0.4

  acc_lim_theta: 2.5
  acc_lim_x: 1.5
  acc_lim_y: 0.0

  holonomic_robot: false
  dwa: true

  sim_time: 1.0
  vx_samples: 8
  vtheta_samples: 20

  path_distance_bias: 0.8
  goal_distance_bias: 0.6
  occdist_scale: 0.05
  heading_lookahead: 0.325
  oscillation_reset_dist: 0.05
