# Robust AMCL profile: better recovery from kidnapped-robot disturbances.
odom_model_type: diff
odom_alpha5: 0.1
gui_publish_rate: 10.0
laser_max_beams: 60
min_particles: 1200
max_particles: 8000
kld_err: 0.03
kld_z: 0.99
odom_alpha1: 0.25
odom_alpha2: 0.25
odom_alpha3: 0.9
odom_alpha4: 0.25
laser_z_hit: 0.65
laser_z_short: 0.05
laser_z_max: 0.05
laser_z_rand: 0.25
laser_sigma_hit: 0.15
laser_lambda_short: 0.1
laser_model_type: likelihood_field
laser_likelihood_max_dist: 2.0
update_min_d: 0.1
update_min_a: 0.2
odom_frame_id: odom
base_frame_id: base_footprint
global_frame_id: map
resample_interval: 1
transform_tolerance: 0.2
recovery_alpha_slow: 0.002
recovery_alpha_fast: 0.1
