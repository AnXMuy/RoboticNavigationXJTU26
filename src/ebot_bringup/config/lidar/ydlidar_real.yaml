# Real-robot lidar configuration used by `my_lidar.launch`.
# If the scan looks mirrored on the robot, adjust `reversion` / `inverted` first.
port: /dev/serial/by-path/platform-3610000.usb-usb-0:2.3:1.0-port0
frame_id: laser_link
ignore_array: ""

baudrate: 115200
lidar_type: 1
device_type: 0
sample_rate: 3
abnormal_check_count: 4
intensity_bit: 10

resolution_fixed: true
auto_reconnect: true
reversion: false
inverted: false
isSingleChannel: true
intensity: false
support_motor_dtr: true
invalid_range_is_inf: false
point_cloud_preservative: false

angle_min: -180.0
angle_max: 180.0
range_min: 0.1
range_max: 8.0
frequency: 10.0
